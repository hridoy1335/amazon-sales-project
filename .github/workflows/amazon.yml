name: Databricks CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to environment'
        required: true
        type: choice
        options: [dev, qa, prod]

env:
  PYTHON_VERSION: '3.10'
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install and validate
        run: |
          pip install ruff pytest
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          ruff check . || true
          pytest tests/ || true

  deploy-dev:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    environment: dev
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Deploy
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          pip install databricks-cli
          
          cat > ~/.databrickscfg <<EOF
          [DEFAULT]
          host = ${{ env.DATABRICKS_HOST }}
          token = $DATABRICKS_TOKEN
          EOF
          
          databricks workspace import-dir ./notebooks /Workspace/Users/deployment/dev/notebooks --overwrite
          
          for job in ./jobs/*.json; do
            [ -f "$job" ] && databricks jobs create --json-file "$job" 2>/dev/null || databricks jobs reset --json-file "$job"
          done

  deploy-qa:
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    environment: qa
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Deploy
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          pip install databricks-cli
          
          cat > ~/.databrickscfg <<EOF
          [DEFAULT]
          host = ${{ env.DATABRICKS_HOST }}
          token = $DATABRICKS_TOKEN
          EOF
          
          databricks workspace import-dir ./notebooks /Workspace/Users/deployment/qa/notebooks --overwrite
          
          for job in ./jobs/*.json; do
            [ -f "$job" ] && databricks jobs create --json-file "$job" 2>/dev/null || databricks jobs reset --json-file "$job"
          done

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-qa
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    environment: prod
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Deploy
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          pip install databricks-cli
          
          cat > ~/.databrickscfg <<EOF
          [DEFAULT]
          host = ${{ env.DATABRICKS_HOST }}
          token = $DATABRICKS_TOKEN
          EOF
          
          databricks workspace import-dir ./notebooks /Workspace/Users/deployment/prod/notebooks --overwrite
          
          for job in ./jobs/*.json; do
            [ -f "$job" ] && databricks jobs create --json-file "$job" 2>/dev/null || databricks jobs reset --json-file "$job"
          done
