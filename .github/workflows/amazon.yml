name: Databricks CI/CD

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]

env:
  PYTHON_VERSION: '3.10'
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install and validate
        run: |
          pip install ruff pytest
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          ruff check . || true
          pytest tests/ || true

  deploy-dev:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: dev
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Deploy to DEV
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          pip install databricks-cli
          
          cat > ~/.databrickscfg <<EOF
          [DEFAULT]
          host = ${{ env.DATABRICKS_HOST }}
          token = $DATABRICKS_TOKEN
          EOF
          
          databricks workspace import-dir ./notebooks /Workspace/Users/deployment/dev/notebooks --overwrite
          
          for job in ./jobs/*.json; do
            [ -f "$job" ] && databricks jobs create --json-file "$job" 2>/dev/null || databricks jobs reset --json-file "$job"
          done

  deploy-qa:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/qa' && github.event_name == 'push'
    environment: qa
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Deploy to QA
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          pip install databricks-cli
          
          cat > ~/.databrickscfg <<EOF
          [DEFAULT]
          host = ${{ env.DATABRICKS_HOST }}
          token = $DATABRICKS_TOKEN
          EOF
          
          databricks workspace import-dir ./notebooks /Workspace/Users/deployment/qa/notebooks --overwrite
          
          for job in ./jobs/*.json; do
            [ -f "$job" ] && databricks jobs create --json-file "$job" 2>/dev/null || databricks jobs reset --json-file "$job"
          done

  deploy-prod:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: prod
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Deploy to PROD
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          pip install databricks-cli
          
          cat > ~/.databrickscfg <<EOF
          [DEFAULT]
          host = ${{ env.DATABRICKS_HOST }}
          token = $DATABRICKS_TOKEN
          EOF
          
          databricks workspace import-dir ./notebooks /Workspace/Users/deployment/prod/notebooks --overwrite
          
          for job in ./jobs/*.json; do
            [ -f "$job" ] && databricks jobs create --json-file "$job" 2>/dev/null || databricks jobs reset --json-file "$job"
          done
