# This is a Databricks asset bundle definition for amazon_sales.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: amazon_sales
  uuid: 1dc1bfde-ccf0-4a1e-ab1c-0811bb3042da

include:
  - resources/*.yml

# Variable declarations with presets that can be overridden via environment variables
# NOTE: If deployment fails with DLT API validation errors about catalog names,
# override via CLI: --var dev_catalog=dev --var dev_schema=default
variables:
  dev_catalog:
    description: Dev catalog name
    default: ${env.DEV_CATALOG:-dev_amazon}
  dev_schema:
    description: Dev schema name
    default: ${env.DEV_SCHEMA:-bronze}
  qa_catalog:
    description: QA catalog name
    default: ${env.QA_CATALOG:-qa_amazon}
  qa_schema:
    description: QA schema name
    default: ${env.QA_SCHEMA:-bronze}
  prod_catalog:
    description: Production catalog name
    default: ${env.PROD_CATALOG:-prod_amazon}
  prod_schema:
    description: Production schema name
    default: ${env.PROD_SCHEMA:-bronze}
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: ${var.dev_catalog}
      schema: ${var.dev_schema}
    permissions:
      - user_name: rkhridoyinfo@gmail.com
        level: CAN_MANAGE
  qa:
    mode: production
    workspace:
      root_path: /Workspace/Users/rkhridoyinfo@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ${var.qa_catalog}
      schema: ${var.qa_schema}
    permissions:
      - user_name: rkhridoyinfo@gmail.com
        level: CAN_MANAGE
      # QA team can run jobs and view results but not modify
      - group_name: qa_team
        level: CAN_RUN
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/rkhridoyinfo@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ${var.prod_catalog}
      schema: ${var.prod_schema}
    permissions:
      - user_name: rkhridoyinfo@gmail.com
        level: CAN_MANAGE
      # Production users can view and use data but not run/modify
      - group_name: prod_users
        level: CAN_VIEW
