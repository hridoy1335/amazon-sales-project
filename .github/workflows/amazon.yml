name: Databricks CI/CD

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]

env:
  PYTHON_VERSION: '3.10'
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          databricks --version
      
      - name: Verify Bundle Structure
        run: |
          echo "Checking for databricks.yml..."
          if [ ! -f "databricks.yml" ]; then
            echo "❌ Error: databricks.yml not found!"
            exit 1
          fi
          echo "✅ databricks.yml found"
          
          echo "Checking for resources directory..."
          if [ ! -d "resources" ]; then
            echo "❌ Error: resources/ directory not found!"
            exit 1
          fi
          echo "✅ resources/ directory found"
          
          ls -la
          echo ""
          echo "Bundle structure verified!"
      
      - name: Validate Bundle - DEV
        if: github.ref == 'refs/heads/dev' || github.event_name == 'pull_request'
        run: |
          echo "Validating DEV target..."
          databricks bundle validate -t dev
          echo "✅ DEV validation passed"
      
      - name: Validate Bundle - QA
        if: github.ref == 'refs/heads/qa' || github.event_name == 'pull_request'
        run: |
          echo "Validating QA target..."
          databricks bundle validate -t qa
          echo "✅ QA validation passed"
      
      - name: Validate Bundle - PROD
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          echo "Validating PROD target..."
          databricks bundle validate -t prod
          echo "✅ PROD validation passed"

  deploy-dev:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          databricks --version
      
      - name: Deploy Bundle to DEV
        run: |
          echo "🚀 Deploying to DEV environment..."
          databricks bundle deploy -t dev
          echo "✅ Successfully deployed to DEV environment"
      
      - name: Run ETL Pipeline (Optional)
        run: |
          echo "To trigger the pipeline, run:"
          echo "databricks bundle run amazon_sales_etl_pipeline -t dev"

  deploy-qa:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/qa' && github.event_name == 'push'
    environment: qa
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          databricks --version
      
      - name: Deploy Bundle to QA
        run: |
          echo "🚀 Deploying to QA environment..."
          databricks bundle deploy -t qa
          echo "✅ Successfully deployed to QA environment"
      
      - name: Run ETL Pipeline (Optional)
        run: |
          echo "To trigger the pipeline, run:"
          echo "databricks bundle run amazon_sales_etl_pipeline -t qa"

  deploy-prod:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          databricks --version
      
      - name: Deploy Bundle to PROD
        run: |
          echo "🚀 Deploying to PROD environment..."
          databricks bundle deploy -t prod
          echo "✅ Successfully deployed to PROD environment"
      
      - name: Deployment Summary
        run: |
          echo "📊 Deployment Summary:"
          echo "  Environment: PRODUCTION"
          echo "  Branch: main"
          echo "  Commit: ${{ github.sha }}"
          echo ""
          echo "To trigger the pipeline, run:"
          echo "databricks bundle run amazon_sales_etl_pipeline -t prod"
